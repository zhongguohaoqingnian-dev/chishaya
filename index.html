<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>吃啥呀 · 阳江校区吃饭指南</title>
<meta name="description" content="阳江校区吃饭指南：校内校外随机选餐、搜索菜品、收藏好店。iPhone 和安卓都能用。" />
<meta name="theme-color" content="#FF6B4A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="吃啥呀" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="stylesheet" href="./iphone.css" />
<script src="./iphone.js" defer></script>
<style>
  :root{
    --brand:#FF6B4A; --brand-deep:#F04E2C; --brand-soft:#FFE7DE;
    --gold:#FFB020; --green:#2EC4B6; --green-soft:#DFF6F1;
    --red:#F0544F; --red-soft:#FDECEC;
    --bg:#FFF7F0; --card:#FFFFFF; --ink:#3A2B27; --ink2:#8A756C; --line:#F3E6DB;
    --shadow:0 8px 24px rgba(240,120,80,.10);
    --r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
  ::placeholder{color:#c8b8ae}
  .app{
    max-width:460px; margin:0 auto; background:#FFF9F4; min-height:100dvh;
    position:relative; padding-bottom:84px; box-shadow:0 0 0 1px var(--line);
  }
  @media(min-width:600px){
    body{
      background:
        radial-gradient(1200px 600px at 10% -10%, #FFE0C7 0%, transparent 55%),
        radial-gradient(1000px 500px at 110% 10%, #FFD8E2 0%, transparent 50%),
        radial-gradient(900px 700px at 50% 120%, #D8F5EE 0%, transparent 55%),
        #FFF3E9;
    }
    .app{margin:24px auto;border-radius:34px;min-height:calc(100dvh - 48px);overflow:hidden;box-shadow:0 16px 40px rgba(240,120,80,.16)}
  }

  /* ===== 首页顶部 ===== */
  .hero{
    background:linear-gradient(135deg,#FF7A55 0%,#FF5E7E 100%);
    color:#fff; padding:18px 18px 20px; border-radius:0 0 26px 26px;
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.5px}
  .brand .logo{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px}
  .brand small{display:block;font-size:11px;font-weight:500;opacity:.9}
  .hero-sub{margin-top:12px;font-size:12px;opacity:.92;display:flex;gap:8px;flex-wrap:wrap}
  .hero-sub span{background:rgba(255,255,255,.18);padding:3px 9px;border-radius:20px}

  /* ===== 通用 ===== */
  .sec{padding:0 18px;margin-top:20px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .sec-h h2{font-size:16px;font-weight:800}
  .sec-h .more{font-size:12px;color:var(--ink2)}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
  .empty{padding:26px 16px;text-align:center;color:var(--ink2);font-size:13px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
  .muted{color:var(--ink2)}

  /* ===== 帮我决定 ===== */
  .decide{margin:16px 18px 0;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
  .decide-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
  .decide-h small{margin-left:auto;font-size:11px;color:var(--ink2);font-weight:500}
  .area-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .area-btn{
    padding:12px;border-radius:16px;background:#FAF3EC;font-size:14px;font-weight:700;color:var(--ink2);
    border:1.5px solid transparent;transition:.18s
  }
  .area-btn b{display:block;font-size:15px;color:var(--ink)}
  .area-btn small{font-size:11px;font-weight:500}
  .area-btn.on{background:linear-gradient(135deg,#FFD8C0,#FFC1C9);border-color:var(--brand);color:var(--brand-deep)}
  .area-btn.on small{color:var(--brand-deep)}
  .btn-primary{
    width:100%;margin-top:12px;padding:13px;border-radius:16px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--brand),#FF5E7E);box-shadow:0 8px 18px rgba(240,80,60,.28);
    transition:.18s
  }
  .btn-primary:active{transform:scale(.98)}
  .btn-primary[disabled]{opacity:.45;box-shadow:none}
  .decide-result{margin-top:14px}
  .dr-card{background:linear-gradient(135deg,#FFF3E8,#FFE9EF);border-radius:18px;padding:14px;border:1px solid #FFD9C6}
  .dr-top{display:flex;align-items:center;gap:12px}
  .dr-emoji{font-size:36px;flex:0 0 auto}
  .dr-name{font-size:16px;font-weight:800}
  .dr-where{font-size:11px;color:var(--ink2);margin-top:2px}
  .dr-dish{margin-top:12px;background:#fff;border-radius:14px;padding:11px 12px}
  .dr-dish .t{font-size:11px;color:var(--ink2);font-weight:700}
  .dr-dish .n{font-size:14px;font-weight:800;margin-top:3px}
  .dr-dish .d{font-size:12px;color:var(--ink2);margin-top:4px}
  .dr-dish .p{color:var(--brand-deep);font-weight:800;font-size:14px;float:right;margin-top:-20px}
  .dr-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
  .btn-ghost{padding:10px;border-radius:14px;background:#fff;font-size:13px;font-weight:700;color:var(--brand-deep);border:1px solid #FFD9C6}
  .decide-empty{margin-top:12px;text-align:center;font-size:12px;color:var(--ink2);padding:10px 0 2px}
  .decide-filters{margin-top:10px}
  .chips.sm{padding:0;gap:6px;margin-top:6px}
  .chip.sm{font-size:11px;padding:5px 10px;box-shadow:none;background:#F7F1EA;color:#9b8b80}
  .chip.sm.on{background:var(--brand);color:#fff}

  /* ===== 食堂入口 ===== */
  .group-list{display:flex;flex-direction:column;gap:10px}
  .group-card{
    display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:13px 14px;
    box-shadow:var(--shadow);text-align:left;transition:.18s
  }
  .group-card:active{transform:scale(.985)}
  .g-emoji{font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:0 0 auto}
  .g-main{flex:1;min-width:0}
  .g-main b{font-size:14px}
  .g-main small{display:block;font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-count{font-size:11px;color:var(--brand-deep);background:var(--brand-soft);padding:4px 9px;border-radius:20px;font-weight:700;white-space:nowrap}

  /* ===== 横向菜品 ===== */
  .hscroll{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .mini{flex:0 0 152px;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
  .mini .pic{font-size:34px;text-align:center;line-height:1;margin:2px 0 8px}
  .mini .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .s{font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .row{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
  .price{color:var(--brand-deep);font-weight:800;font-size:14px}
  .stars{color:var(--gold);font-size:11px;letter-spacing:.5px}
  .rate-num{font-size:11px;color:var(--ink2);margin-left:3px}

  /* ===== 页面头 ===== */
  .page-head{
    position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#FF7A55,#FF5E7E);color:#fff;
    padding:14px 16px;display:flex;align-items:center;gap:12px;border-radius:0 0 22px 22px
  }
  .page-head .back{font-size:24px;line-height:1;padding:0 4px}
  .page-head b{font-size:16px;font-weight:800}
  .page-head .sub{font-size:11px;opacity:.9;margin-left:auto}

  /* ===== 店铺列表 ===== */
  .floor-title{font-size:12px;font-weight:800;color:var(--ink2);margin:16px 18px 8px;display:flex;align-items:center;gap:6px}
  .floor-title::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--brand)}
  .shop-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;
    box-shadow:var(--shadow);margin:0 18px 10px;text-align:left;width:calc(100% - 36px)
  }
  .shop-emoji{font-size:24px;width:42px;height:42px;border-radius:13px;background:var(--bg);display:grid;place-items:center;flex:0 0 auto}
  .shop-main{flex:1;min-width:0}
  .shop-main .n{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
  .shop-main .s{font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shop-right{text-align:right;flex:0 0 auto}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
  .b-open{background:var(--green-soft);color:#1e9e8f}
  .b-close{background:#F1EAE4;color:#9b8b80}
  .b-hot{background:var(--red-soft);color:#E2403A}
  .b-new{background:#E7F0FF;color:#3B82F6}

  /* ===== 店铺详情 ===== */
  .shop-hero{margin:14px 18px 0;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);position:relative}
  .shop-hero .top{display:flex;align-items:center;gap:12px}
  .shop-hero .big{font-size:40px}
  .shop-hero h1{font-size:19px;font-weight:800}
  .shop-hero .where{font-size:11px;color:var(--ink2);margin-top:3px}
  .shop-hero .desc{font-size:12.5px;color:#6d5b52;margin-top:11px;line-height:1.65}
  .shop-hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pill{font-size:11px;background:var(--bg);color:#8a756c;padding:4px 9px;border-radius:20px}
  .pill.price{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
  .edit-btn{position:absolute;right:14px;top:14px;font-size:11px;background:var(--brand-soft);color:var(--brand-deep);padding:5px 10px;border-radius:20px;font-weight:700}

  /* ===== 菜品行 ===== */
  .dish-list{padding:0 18px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .dish-row{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
  .d-emoji{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:0 0 auto}
  .d-main{flex:1;min-width:0}
  .d-top{display:flex;align-items:center;gap:7px}
  .d-top b{font-size:14px}
  .d-sub{font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-desc{font-size:12px;color:#7c6a61;margin-top:5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .d-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{font-size:10px;color:#a0816c;background:#FBF1E9;padding:2px 7px;border-radius:14px}
  .tag.warn{color:#d6453f;background:var(--red-soft)}
  .tag.good{color:#1e9e8f;background:var(--green-soft)}

  /* ===== 搜索 ===== */
  .search-wrap{padding:12px 18px 0}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:9px 12px;box-shadow:var(--shadow)}
  .search-box input{border:none;outline:none;width:100%;background:transparent;font-size:14px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 18px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:20px;background:var(--card);color:var(--ink2);font-weight:600;border:1px solid transparent;box-shadow:0 2px 8px rgba(240,120,80,.08)}
  .chip.on{background:var(--brand);color:#fff}
  .result-tip{padding:14px 18px 0;font-size:12px;color:var(--ink2)}

  /* ===== 管理 ===== */
  .manage-tip{margin:14px 18px 0;font-size:12px;color:var(--ink2);background:#FFF3E9;border-radius:14px;padding:11px 13px;line-height:1.6}
  .manage-actions{display:flex;gap:10px;padding:12px 18px 0}
  .manage-actions button{flex:1;padding:11px;border-radius:14px;font-size:13px;font-weight:700;background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(240,80,60,.22)}
  .manage-actions .light{background:var(--card);color:var(--ink2);box-shadow:var(--shadow)}
  .m-group{margin-top:16px}
  .m-title{font-size:12px;font-weight:800;color:var(--ink2);padding:0 18px 7px;display:flex;gap:6px}
  .m-title span{margin-left:auto;font-weight:600}
  .m-row{display:flex;align-items:center;gap:10px;background:var(--card);margin:0 18px 8px;padding:10px 12px;border-radius:14px;box-shadow:var(--shadow)}
  .m-row .shop-emoji{width:34px;height:34px;font-size:19px;border-radius:10px}
  .m-name{flex:1;font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-btn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--brand-soft);color:var(--brand-deep)}
  .mini-btn.danger{background:var(--red-soft);color:#d6453f}
  .mini-btn.plain{background:#F5EFE9;color:var(--ink2)}

  /* ===== 底部导航 ===== */
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;z-index:120;
    background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#b3a49a;font-weight:700;padding:3px 0}
  .tab .ico{font-size:19px;line-height:1;opacity:.65;filter:grayscale(1)}
  .tab.active{color:var(--brand-deep)}
  .tab.active .ico{opacity:1;filter:none}

  /* ===== 弹层 ===== */
  .mask{position:fixed;inset:0;background:rgba(58,43,39,.45);opacity:0;pointer-events:none;transition:.22s;z-index:200}
  .mask.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;z-index:210;
    background:#FFFDFB;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:86dvh;overflow-y:auto
  }
  .sheet.open{transform:translateY(0)}
  .sheet-top{display:flex;align-items:center;gap:12px}
  .sheet-top .big{font-size:42px}
  .sheet-top h2{font-size:19px;font-weight:800}
  .sheet-top .where{font-size:11px;color:var(--ink2);margin-top:3px}
  .sheet-close{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#F5EFE9;color:#9b8b80;font-size:16px}
  .sheet-price{font-size:22px;font-weight:800;color:var(--brand-deep);margin-top:10px}
  .sheet-desc{font-size:13px;color:#6d5b52;margin-top:9px;line-height:1.7}
  .sheet-sec{font-size:12px;font-weight:800;color:var(--ink2);margin-top:14px}
  .sheet-fav{width:100%;margin-top:14px;padding:13px;border-radius:16px;font-size:14px;font-weight:800;background:var(--brand-soft);color:var(--brand-deep)}
  .sheet-fav.on{background:#FFE1DC;color:#D63B2F}
  .sheet-go{width:100%;margin-top:9px;padding:12px;border-radius:16px;font-size:13px;font-weight:700;background:#F5EFE9;color:var(--ink2)}

  /* ===== 编辑器 ===== */
  .editor{
    position:fixed;inset:0;max-width:460px;margin:0 auto;z-index:300;background:var(--bg);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
    display:flex;flex-direction:column
  }
  .editor.open{transform:translateY(0)}
  .editor.sub{z-index:320}
  .ed-head{
    background:linear-gradient(135deg,#FF7A55,#FF5E7E);color:#fff;padding:14px 16px;
    display:flex;align-items:center;gap:12px;flex:0 0 auto
  }
  .ed-head .back{font-size:24px;line-height:1;padding:0 4px}
  .ed-head b{font-size:16px}
  .ed-body{flex:1;overflow-y:auto;padding:16px 18px calc(28px + env(safe-area-inset-bottom))}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
  .field input,.field select,.field textarea{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    outline:none;font-size:14px;line-height:1.5
  }
  .field textarea{resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#FFB59E;background:#FFFDFB}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:70px 1fr 1fr;gap:10px}
  .ed-dishes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .ed-dish{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:9px 11px;box-shadow:var(--shadow)}
  .ed-dish .n{flex:1;font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ed-dish .p{font-size:12px;color:var(--brand-deep);font-weight:700}
  .save-btn{width:100%;margin-top:18px;padding:13px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#FF5E7E);color:#fff;font-size:15px;font-weight:800;box-shadow:0 8px 18px rgba(240,80,60,.26)}
  .del-btn{width:100%;margin-top:10px;padding:12px;border-radius:16px;background:var(--red-soft);color:#d6453f;font-size:13px;font-weight:800}

  /* ===== 确认框 ===== */
  .confirm{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(58,43,39,.45);padding:0 34px}
  .confirm.open{display:flex}
  .confirm-box{width:100%;max-width:320px;background:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .confirm-box p{font-size:14px;line-height:1.6;margin-bottom:16px}
  .confirm-box .row{display:flex;gap:10px}
  .confirm-box button{flex:1;padding:11px;border-radius:14px;font-size:14px;font-weight:700;background:#F5EFE9;color:var(--ink2)}
  .confirm-box .ok{background:var(--brand);color:#fff}
  .confirm-box .ok.danger{background:var(--red)}

  /* ===== Toast ===== */
  #toast{
    position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);z-index:500;
    background:rgba(58,43,39,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;
    opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:90%
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  .view{display:none}
  .view.active{display:block}
</style>
</head>
<body>

<div class="app">
  <!-- 首页 -->
  <section class="view active" id="view-home">
    <div class="hero">
      <div class="brand-row">
        <div class="brand">
          <div class="logo">🍚</div>
          <div>吃啥呀<small>阳江校区 · 吃饭指南</small></div>
        </div>
      </div>
      <div class="phone-actions">
        <button onclick="shareApp()">↗ 分享给同学</button>
        <button onclick="openInstallHelp()">＋ 添加到桌面</button>
      </div>
      <div class="hero-sub">
        <span>嘉禾 · 桃李</span><span>门口商铺</span><span>市区好店</span>
      </div>
    </div>

    <div class="decide">

/* ============================================================
   2. 本地存储
   ============================================================ */
const DATA_KEY = 'cc_shops_v1';
const FAV_KEY = 'cc_favs_v1';
const DATA_VER = 1;

let DATA = { ver: DATA_VER, shops: [] };
let favs = [];
const shopMap = {};
const dishMap = {};

function pad2(n) { return String(n).padStart(2, '0'); }

function parseRange(h) {
  const s = String(h || '');
  let m = s.match(/(\d{1,2}):(\d{2})\s*[-~～—–到至]\s*(\d{1,2}):(\d{2})/);
  if (m) return { open: pad2(m[1]) + ':' + m[2], close: pad2(m[3]) + ':' + m[4] };
  m = s.match(/(\d{1,2}):(\d{2})/);
  if (m) return { open: pad2(m[1]) + ':' + m[2], close: '22:00' };
  return { open: '', close: '' };
}

function normalizeShops(shops) {
  shops.forEach((s, i) => {
    if (!s.id) s.id = 's' + (i + 1);
    s.dishes = Array.isArray(s.dishes) ? s.dishes : [];
    s.tags = Array.isArray(s.tags) ? s.tags : [];
    s.rating = Number(s.rating) || 0;
    s.avg = Number(s.avg) || 0;
    s.group = GROUP_META[s.group] ? s.group : '嘉禾食堂';
    if (!s.floor) s.floor = s.group === '嘉禾食堂' || s.group === '桃李食堂' ? '一楼' : (s.group === '学校门口' ? '商铺' : '市区');
    const r = parseRange(s.hours);
    if (!s.open) s.open = r.open;
    if (!s.close) s.close = r.close;
    s.dishes.forEach((d, j) => {
      if (!d.id) d.id = s.id + '-d' + (j + 1);
      d.price = Number(d.price) || 0;
      d.rating = Number(d.rating) || 0;
      d.tags = Array.isArray(d.tags) ? d.tags : [];
    });
  });
  return shops;
}

function saveData() {
  try { localStorage.setItem(DATA_KEY, JSON.stringify({ ver: DATA_VER, shops: DATA.shops })); } catch (e) {}
}

function loadFavs() {
  try {
    const v = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    favs = Array.isArray(v) ? v : [];
  } catch (e) { favs = []; }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
}

function initData() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); } catch (e) {}
  if (saved && saved.ver === DATA_VER && Array.isArray(saved.shops)) {
    DATA = saved;
  } else {
    DATA = { ver: DATA_VER, shops: JSON.parse(JSON.stringify(BASE_SHOPS)) };
  }
  normalizeShops(DATA.shops);
  rebuildIndex();
  saveData();
}

function rebuildIndex() {
  Object.keys(shopMap).forEach(k => delete shopMap[k]);
  Object.keys(dishMap).forEach(k => delete dishMap[k]);
  DATA.shops.forEach(s => {
    shopMap[s.id] = s;
    s.dishes.forEach(d => { dishMap[d.id] = { shop: s, dish: d }; });
  });
  // 收藏里可能残留已删除的菜
  const before = favs.length;
  favs = favs.filter(id => !!dishMap[id]);
  if (favs.length !== before) saveFavs();
}

/* ============================================================
   3. 工具
   ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
function starText(r) {
  const n = Math.max(0, Math.min(5, Math.round(r || 0)));
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}
function rateText(r) { return r ? r.toFixed(1) : '暂无'; }
function areaOf(s) { return (GROUP_META[s.group] || {}).area || 'in'; }
function money(v) { return v > 0 ? '¥' + v : '价格未知'; }
function toMin(t) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}
function isOpen(s) {
  const o = toMin(s.open), c = toMin(s.close);
  if (o == null || c == null) return null;
  const d = new Date(), n = d.getHours() * 60 + d.getMinutes();
  return c > o ? (n >= o && n < c) : (n >= o || n < c);
}
function openBadge(s) {
  const on = isOpen(s);
  if (on === null) return '';
  return on ? '<span class="badge b-open">营业中</span>' : '<span class="badge b-close">已打烊</span>';
}
// 营业时间的区间（跨夜会拆成两段）
function openIntervals(s) {
  const o = toMin(s.open), c = toMin(s.close);
  if (o == null || c == null) return [];
  if (c > o) return [[o, c]];
  return [[o, 1440], [0, c]];
}
function servesMeal(s, meal) {
  const w = MEALS[meal];
  if (!w) return true;
  return openIntervals(s).some(iv => iv[0] < w[1] && iv[1] > w[0]);
}
function priceInRange(v, key, allowZero) {
  if (key === '不限') return true;
  const r = PRICE_RANGES[key];
  if (!r) return true;
  if (!v) return !!allowZero;
  return v >= r[0] && v < r[1];
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1600);
}
function tagHtml(tags, extra) {
  return (tags || []).map(t => {
    const warn = /避雷|超辣|烧胃|偏贵|注意|待打卡/.test(t);
    return '<span class="tag' + (warn ? ' warn' : '') + '">' + esc(t) + '</span>';
  }).join('');
}

let currentGroup = '嘉禾食堂';
let lastMainView = 'home';

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  if (name === 'home' || name === 'search' || name === 'fav' || name === 'manage') lastMainView = name;
  window.scrollTo(0, 0);
  if (name === 'home') renderHome();
  if (name === 'search') renderSearch();
  if (name === 'fav') renderFav();
  if (name === 'manage') renderManage();
  if (name === 'group') renderGroup();
  if (name === 'shop') renderShop();
}
function goHome() { showView('home'); }

/* ============================================================
   5. 首页
   ============================================================ */
let decideArea = '';
let decideMeal = '不限';
let decidePrice = '不限';
let decideResult = null;
let rolling = false;

function setArea(a) {
  decideArea = a;
  decideResult = null;
  renderDecide();
}
function setDecideMeal(m) { decideMeal = m; decideResult = null; renderDecide(); }
function setDecidePrice(p) { decidePrice = p; decideResult = null; renderDecide(); }

function decidePool() {
  return DATA.shops.filter(s => {
    if (areaOf(s) !== decideArea) return false;
    if (decideMeal !== '不限' && !servesMeal(s, decideMeal)) return false;
    if (!priceInRange(s.avg, decidePrice, false)) return false;
    return true;
  });
}

function renderDecide() {
  document.querySelectorAll('.area-btn').forEach(b => b.classList.toggle('on', b.dataset.area === decideArea));
  document.getElementById('decide-meal-chips').innerHTML = ['不限'].concat(Object.keys(MEALS)).map(m =>
    '<button class="chip sm' + (decideMeal === m ? ' on' : '') + '" onclick="setDecideMeal(\'' + m + '\')">' +
      (m === '不限' ? '不限时段' : m) + '</button>').join('');
  document.getElementById('decide-price-chips').innerHTML = ['不限'].concat(Object.keys(PRICE_RANGES)).map(p =>
    '<button class="chip sm' + (decidePrice === p ? ' on' : '') + '" onclick="setDecidePrice(\'' + p + '\')">' +
      (p === '不限' ? '不限价格' : p + ' 元') + '</button>').join('');
  const btn = document.getElementById('btn-decide');
  btn.disabled = !decideArea || rolling;
  renderDecideResult();
}
function renderDecideResult() {
  const el = document.getElementById('decide-result');
  if (!decideArea) {
    el.innerHTML = '<div class="decide-empty">先选「校内」或「校外」，再点开始随机 🍚</div>';
    return;
  }
  if (!decideResult) {
    const n = decidePool().length;
    el.innerHTML = n
      ? '<div class="decide-empty">范围已选好，点上面的按钮，帮你从 ' + n + ' 家店里挑一个</div>'
      : '<div class="decide-empty">这个组合下没有店，放宽时段或价格试试</div>';
    return;
  }
  const s = shopMap[decideResult.shopId];
  if (!s) { decideResult = null; renderDecideResult(); return; }
  const dd = decideResult.dishId ? dishMap[decideResult.dishId] : null;
  const dish = dd ? dd.dish : null;
  el.innerHTML =
    '<div class="dr-card">' +
      '<div class="dr-top">' +
        '<div class="dr-emoji">' + esc(s.emoji) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="dr-name">' + esc(s.name) + ' ' + openBadge(s) + '</div>' +
          '<div class="dr-where">' + esc(s.group) + (s.floor && s.floor !== s.group ? ' · ' + esc(s.floor) : '') +
            ' · ' + money(s.avg) + '</div>' +
        '</div>' +
      '</div>' +
      (dish
        ? '<div class="dr-dish"><div class="t">今天就吃这个</div><div class="n">' + esc(dish.emoji) + ' ' + esc(dish.name) +
          '<span class="p">' + money(dish.price) + '</span></div><div class="d">' + esc(dish.desc) + '</div></div>'
        : '') +
      '<div class="dr-row">' +
        '<button class="btn-ghost" onclick="rollOnce()">换一个</button>' +
        '<button class="btn-ghost" onclick="openShop(\'' + s.id + '\')">看看这家</button>' +
      '</div>' +
    '</div>';
}
function rollingHTML(s) {
  return '<div class="dr-card"><div class="dr-top"><div class="dr-emoji">' + esc(s.emoji) + '</div>' +
    '<div style="flex:1"><div class="dr-name">' + esc(s.name) + '</div>' +
    '<div class="dr-where">' + esc(s.group) + ' · ' + money(s.avg) + '</div></div></div></div>';
}
function weightedPick(pool) {
  const weights = pool.map(s => (s.rating >= 4.5 ? 4 : s.rating >= 4 ? 2 : 1));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function rollOnce() {
  if (!decideArea) { toast('先选校内还是校外'); return; }
  if (rolling) return;
  const pool = decidePool();
  if (!pool.length) { toast('这个条件下没有店，放宽一点'); return; }
  rolling = true;
  const btn = document.getElementById('btn-decide');
  btn.disabled = true;
  btn.textContent = '正在挑…';
  const el = document.getElementById('decide-result');
  let ticks = 0;
  const timer = setInterval(() => {
    const s = pool[Math.floor(Math.random() * pool.length)];
    el.innerHTML = rollingHTML(s);
    ticks++;
    if (ticks >= 13) {
      clearInterval(timer);
      const pick = weightedPick(pool);
      const dish = pick.dishes.length ? pick.dishes[Math.floor(Math.random() * pick.dishes.length)] : null;
      decideResult = { shopId: pick.id, dishId: dish ? dish.id : '' };
      rolling = false;
      btn.textContent = '再帮我决定一次';
      renderDecide();
    }
  }, 65);
}

let searchArea = '全部';

function setSearchArea(a) { searchArea = a; renderSearch(); }
function setSearchGroup(g) { searchGroup = g; renderSearch(); }
function setSearchMeal(m) { searchMeal = m; renderSearch(); }
function setSearchPrice(p) { searchPrice = p; renderSearch(); }

function renderChips() {

      (p === '不限' ? '不限价格' : p + ' 元') + '</button>').join('');
}

function matchShop(s, kw) {
  const hay = [s.name, s.group, s.floor, s.desc, (s.tags || []).join('')].join(' ').toLowerCase();
  return hay.indexOf(kw) > -1;
}
function matchDish(s, d, kw) {
  const hay = [d.name, d.desc, (d.tags || []).join(''), s.name, s.group].join(' ').toLowerCase();
  return hay.indexOf(kw) > -1;
}
function shopPasses(s) {
  if (searchArea !== '全部') {
    const a = areaOf(s);
    if ((searchArea === '校内' && a !== 'in') || (searchArea === '校外' && a !== 'out')) return false;
  }
  if (searchGroup !== '全部' && s.group !== searchGroup) return false;
  if (searchMeal !== '不限' && !servesMeal(s, searchMeal)) return false;
  if (!priceInRange(s.avg, searchPrice, false)) return false;
  return true;
}
function doSearch() { renderSearch(); }

function renderSearch() {
  renderChips();
  const kw = (document.getElementById('search-input').value || '').trim().toLowerCase();
  const shops = DATA.shops.filter(s => shopPasses(s) && (!kw || matchShop(s, kw)));
  const dishes = [];
  DATA.shops.forEach(s => {
    if (!shopPasses(s)) return;
    s.dishes.forEach(d => {
      if (searchPrice !== '不限' && !priceInRange(d.price, searchPrice, true)) return;
      if (!kw || matchDish(s, d, kw)) dishes.push({ s, d });
    });
  });
  document.getElementById('search-tip').textContent = '找到 ' + shops.length + ' 家店 · ' + dishes.length + ' 道菜';
  let html = '';
  if (shops.length) {
    html += '<div class="floor-title">店铺</div>';
    html += shops.map(s =>
      '<button class="shop-row" onclick="openShop(\'' + s.id + '\')">' +
        '<span class="shop-emoji">' + esc(s.emoji) + '</span>' +
        '<span class="shop-main"><span class="n">' + esc(s.name) + '</span>' +
        '<span class="s">' + esc(s.group) + ' · ' + esc(s.hours) + '</span></span>' +
        '<span class="shop-right"><div class="stars">' + starText(s.rating) + '</div>' +
        '<div class="rate-num">' + (s.avg ? s.avg + ' 元' : '未知') + '</div>' + openBadge(s) + '</span>' +
      '</button>').join('');
  }
  if (dishes.length) {
    html += '<div class="floor-title">菜品</div><div class="dish-list">';
    html += dishes.map(({ s, d }) =>
      '<button class="dish-row" onclick="openDish(\'' + s.id + '\',\'' + d.id + '\')">' +
        '<span class="d-emoji">' + esc(d.emoji) + '</span>' +
        '<span class="d-main">' +
          '<span class="d-top"><b>' + esc(d.name) + '</b>' +
            (d.rating >= 4.5 ? '<span class="tag good">高分</span>' : '') + '</span>' +
          '<span class="d-sub">' + esc(s.name) + ' · ' + esc(s.group) + '</span>' +
          '<span class="d-desc">' + esc(d.desc) + '</span>' +
          '<span class="d-foot"><span class="tags">' + tagHtml(d.tags) + '</span>' +
            '<span class="price">' + money(d.price) + '</span></span>' +
        '</span></button>').join('');
    html += '</div>';
  }
  if (!shops.length && !dishes.length) html = '<div class="empty" style="margin:18px">没有找到，换个关键词试试</div>';
  document.getElementById('search-body').innerHTML = html;
}

function saveShop() {
  const name = document.getElementById('es-name').value.trim();
  if (!name) { toast('先填店名'); return; }
  const group = document.getElementById('es-group').value;
  const hours = document.getElementById('es-hours').value.trim() || '11:20-18:45';
  const range = parseRange(hours);
  const data = {
    name,
    emoji: document.getElementById('es-emoji').value.trim() || '🍽️',
    group,
    floor: document.getElementById('es-floor').value.trim() || '一楼',
    hours,
    open: range.open,
    close: range.close,
    avg: Number(document.getElementById('es-avg').value) || 0,
    rating: Math.max(0, Math.min(5, Number(document.getElementById('es-rating').value) || 0)),
    tags: document.getElementById('es-tags').value.split(/[,，\s]+/).map(x => x.trim()).filter(Boolean),
    desc: document.getElementById('es-desc').value.trim()
  };
  if (editShopId) {
    Object.assign(shopMap[editShopId], data);
  } else {
    const id = 'u' + Date.now();
    DATA.shops.push(Object.assign({ id, dishes: [] }, data));
    editShopId = id;
  }
  saveData();
  rebuildIndex();
  toast('已保存，立即生效');
  renderAll();
  closeShopEditor();
}

function delShop(id) {
  const s = shopMap[id];
  if (!s) return;
  askConfirm('删除「' + s.name + '」？这家店的菜品和收藏也会一起删掉。', () => {
    DATA.shops = DATA.shops.filter(x => x.id !== id);
    saveData();
    rebuildIndex();
    renderAll();
    toast('已删除');
  });
}
function delShopFromEditor() {
  if (!editShopId) return;
  const s = shopMap[editShopId];
  if (!s) return;
  askConfirm('删除「' + s.name + '」？', () => {
    DATA.shops = DATA.shops.filter(x => x.id !== editShopId);
    saveData();
    rebuildIndex();
    editShopId = null;
    document.getElementById('shop-editor').classList.remove('open');
    renderAll();
    showView('manage');
    toast('已删除');
  });
}

function openDishEditor(dishId) {
  if (!editShopId) { toast('先保存店铺，再加菜品'); return; }
  const s = shopMap[editShopId];
  editDishId = dishId || null;
  const d = dishId ? s.dishes.find(x => x.id === dishId) : null;
  document.getElementById('dish-ed-title').textContent = d ? '编辑菜品' : '添加菜品';
  document.getElementById('ed-name').value = d ? d.name : '';
  document.getElementById('ed-emoji').value = d ? d.emoji : '🍚';
  document.getElementById('ed-price').value = d ? (d.price || '') : '';
  document.getElementById('ed-rating').value = d ? (d.rating || '') : '';
  document.getElementById('ed-tags').value = d ? (d.tags || []).join(',') : '';
  document.getElementById('ed-desc').value = d ? d.desc : '';
  document.getElementById('dish-del-btn').style.display = d ? 'block' : 'none';
  document.getElementById('dish-editor').classList.add('open');
}
function closeDishEditor() {
  document.getElementById('dish-editor').classList.remove('open');
  editDishId = null;
}

function saveDish() {
  if (!editShopId) return;
  const s = shopMap[editShopId];
  const name = document.getElementById('ed-name').value.trim();
  if (!name) { toast('先填菜名'); return; }
  const data = {
    name,
    emoji: document.getElementById('ed-emoji').value.trim() || '🍚',
    price: Number(document.getElementById('ed-price').value) || 0,
    rating: Math.max(0, Math.min(5, Number(document.getElementById('ed-rating').value) || 0)),
    tags: document.getElementById('ed-tags').value.split(/[,，\s]+/).map(x => x.trim()).filter(Boolean),
    desc: document.getElementById('ed-desc').value.trim()
  };
  if (editDishId) {
    const d = s.dishes.find(x => x.id === editDishId);
    if (d) Object.assign(d, data);
  } else {
    s.dishes.push(Object.assign({ id: s.id + '-u' + Date.now() }, data));
  }
  saveData();
  rebuildIndex();
  renderEditorDishes();
  renderAll();
  closeDishEditor();
  toast('菜品已保存');
}

function delDish(dishId) {
  if (!editShopId) return;
  const s = shopMap[editShopId];
  const d = s.dishes.find(x => x.id === dishId);
  if (!d) return;
  askConfirm('删除「' + d.name + '」？', () => {
    s.dishes = s.dishes.filter(x => x.id !== dishId);
    saveData();
    rebuildIndex();
    renderEditorDishes();
    renderAll();
    toast('已删除');
  });
}
function delDishFromEditor() {
  if (!editDishId) return;
  const id = editDishId;
  askConfirm('删除这道菜？', () => {
    const s = shopMap[editShopId];
    if (s) s.dishes = s.dishes.filter(x => x.id !== id);
    saveData();
    rebuildIndex();
    closeDishEditor();
    renderEditorDishes();
    renderAll();
    toast('已删除');
  });
}

function askReset() {
  askConfirm('会清空你所有的修改，恢复成 App 内置的数据，确定吗？', () => {
    DATA = { ver: DATA_VER, shops: JSON.parse(JSON.stringify(BASE_SHOPS)) };
    normalizeShops(DATA.shops);
    saveData();
    rebuildIndex();
    decideResult = null;
    renderAll();
    showView('manage');
    toast('已恢复内置数据');
  });
}

/* ============================================================
   10. 确认框
   ============================================================ */
let confirmCb = null;
function askConfirm(msg, cb) {
  confirmCb = cb;
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-layer').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirm-layer').classList.remove('open');
  confirmCb = null;
}
function okConfirm() {
  const cb = confirmCb;
  closeConfirm();
  if (cb) cb();
}

/* ============================================================
   11. 渲染全部 / 返回键 / 初始化
   ============================================================ */
function renderAll() {
  const active = document.querySelector('.view.active');
  const name = active ? active.id.replace('view-', '') : 'home';
  renderHome();
  renderSearch();
  renderFav();
  renderManage();
  if (name === 'group') renderGroup();
  if (name === 'shop') renderShop();
}

window.__androidBack = function () {
  if (document.getElementById('confirm-layer').classList.contains('open')) { closeConfirm(); return true; }
  if (document.getElementById('dish-editor').classList.contains('open')) { closeDishEditor(); return true; }
  if (document.getElementById('shop-editor').classList.contains('open')) { closeShopEditor(); return true; }
  if (document.getElementById('sheet').classList.contains('open')) { closeDish(); return true; }
  if (document.getElementById('view-shop').classList.contains('active')) { showView('group'); return true; }
  if (document.getElementById('view-group').classList.contains('active')) { showView('home'); return true; }
  if (!document.getElementById('view-home').classList.contains('active')) { showView('home'); return true; }
  return false;
};

initData();
loadFavs();
rebuildIndex();
renderAll();
showView('home');


</script>
